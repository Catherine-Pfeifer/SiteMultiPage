<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact | Catherine Pfeifer - Communication &amp; Multimédia</title>
  <meta name="description" content="Prenez contact avec Catherine Pfeifer à Lausanne pour vos projets de communication, vidéo ou web.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">Catherine <span>Pfeifer</span></a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Accueil</a></li>
          <li><a href="a_propos.html" class="nav-link">À Propos</a></li>
          <li><a href="services.html" class="nav-link">Services</a></li>
          <li><a href="portfolio.html" class="nav-link">Portfolio</a></li>
          <li><a href="contact.html" class="nav-link active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-title">
      <h1>Me Contacter</h1>
      <p>Une question ou un projet à discuter ? Remplissez ce formulaire.</p>
    </div>

    <form style="max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; border: 1px solid var(--border-subtle);">
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-weight:600; margin-bottom: 0.5rem;">Nom &amp; Prénom</label>
        <input type="text" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-subtle); border-radius: 6px;" required>
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-weight:600; margin-bottom: 0.5rem;">E-mail</label>
        <input type="email" style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-subtle); border-radius: 6px;" required>
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-weight:600; margin-bottom: 0.5rem;">Message</label>
        <textarea style="width: 100%; padding: 0.8rem; border: 1px solid var(--border-subtle); border-radius: 6px; min-height: 120px;" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Envoyer</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-content"><p>&copy; 2026 Catherine Pfeifer.</p></div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
